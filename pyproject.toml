[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "finchx"
dynamic = ["version"]
description = "An independent Python package for A-share market data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9,<3"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
calendar = ["pandas_market_calendars>=5.4,<6"]
dev = ["pytest>=7", "jsonschema>=4.21", "tomli>=2; python_version < '3.11'"]
jygs = ["playwright>=1.40,<2"]

[tool.setuptools.dynamic]
version = {attr = "finchx.__version__"}

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finchx.schemas" = ["v1/*.schema.json", "v1/examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
