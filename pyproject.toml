[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "finchx"
version = "3.1.0"
description = "提供 A 股行情、财务、公告和研报等数据接口的 Python 库"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Source = "https://github.com/sanshi2026/FinchX"
Documentation = "https://github.com/sanshi2026/FinchX/blob/main/docs/API.md"
Issues = "https://github.com/sanshi2026/FinchX/issues"

[project.optional-dependencies]
calendar = ["pandas_market_calendars>=5.4,<6"]
jygs = ["playwright>=1.50,<2"]
pdf = ["pypdfium2>=5.14,<6"]
dev = ["pytest>=7", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
