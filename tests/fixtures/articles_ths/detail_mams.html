sdw30__tcol1-0a1d\">失业率</span>\n        <span class=\"sdw30__tcol2-2b3e sdw30__tval-expected-0f1c\">4.1%</span>\n        <span class=\"sdw30__tcol3-4c5f sdw30__tval-prev-2a3d\">4.1%</span>\n        <span class=\"sdw30__tcol5-8e9d sdw30__tval-actual-1a2f is-hit\">4.2%</span>\n        <span class=\"sdw30__tcol4-6d7a sdw30__tval-verdict-3c8e\">高于预期</span>\n      </div>\n      <div class=\"sdw30__tablerow-8f9c\">\n        <span class=\"sdw30__tcol1-0a1d\">时薪环比</span>\n        <span class=\"sdw30__tcol2-2b3e sdw30__tval-expected-0f1c\">0.3%</span>\n        <span class=\"sdw30__tcol3-4c5f sdw30__tval-prev-2a3d\">—</span>\n        <span class=\"sdw30__tcol5-8e9d sdw30__tval-actual-1a2f is-hit\">0.1%</span>\n        <span class=\"sdw30__tcol4-6d7a sdw30__tval-verdict-3c8e\">低于预期</span>\n      </div>\n    <div class=\"sdw30__tblgroup-5a3e\">\n        <span class=\"sdw30__tblgtime-8c1f\">20:15</span>\n        <span class=\"sdw30__tblgname-2d4b\">美国9月ADP就业</span>\n        <span class=\"sdw30__tblgdone-9f0e\">已公布</span>\n      </div>\n      <div class=\"sdw30__tablerow-8f9c\">\n        <span class=\"sdw30__tcol1-0a1d\">新增就业</span>\n        <span class=\"sdw30__tcol2-2b3e sdw30__tval-expected-0f1c\">约7万</span>\n        <span class=\"sdw30__tcol3-4c5f sdw30__tval-prev-2a3d\">3.6万</span>\n        <span class=\"sdw30__tcol5-8e9d sdw30__tval-actual-1a2f is-hit\">9万</span>\n        <span class=\"sdw30__tcol4-6d7a sdw30__tval-verdict-3c8e\">高于预期</span>\n      </div>\n      <div class=\"sdw30__tblgroup-5a3e\">\n        <span class=\"sdw30__tblgtime-8c1f\">20:30</span>\n        <span class=\"sdw30__tblgname-2d4b\">美国8月PCE物价</span>\n        <span class=\"sdw30__tblgdone-9f0e\">已公布</span>\n      </div>\n      <div class=\"sdw30__tablerow-8f9c\">\n        <span class=\"sdw30__tcol1-0a1d\">核心PCE同比</span>\n        <span class=\"sdw30__tcol2-2b3e sdw30__tval-expected-0f1c\">3.3%</span>\n        <span class=\"sdw30__tcol3-4c5f sdw30__tval-prev-2a3d\">3.0%</span>\n        <span class=\"sdw30__tcol5-8e9d sdw30__tval-actual-1a2f is-hit\">3.0%</span>\n        <span class=\"sdw30__tcol4-6d7a sdw30__tval-verdict-3c8e\">低于预期</span>\n      </div>\n      <div class=\"sdw30__tablerow-8f9c\">\n        <span class=\"sdw30__tcol1-0a1d\">核心PCE环比</span>\n        <span class=\"sdw30__tcol2-2b3e sdw30__tval-expected-0f1c\">0.3%</span>\n        <span class=\"sdw30__tcol3-4c5f sdw30__tval-prev-2a3d\">0.1%</span>\n        <span class=\"sdw30__tcol5-8e9d sdw30__tval-actual-1a2f is-hit\">0.2%</span>\n        <span class=\"sdw30__tcol4-6d7a sdw30__tval-verdict-3c8e\">低于预期</span>\n      </div>\n      <div class=\"sdw30__tablerow-8f9c\">\n        <span class=\"sdw30__tcol1-0a1d\">整体PCE环比</span>\n        <span class=\"sdw30__tcol2-2b3e sdw30__tval-expected-0f1c\">0.4%</span>\n        <span class=\"sdw30__tcol3-4c5f sdw30__tval-prev-2a3d\">0.1%</span>\n        <span class=\"sdw30__tcol5-8e9d sdw30__tval-actual-1a2f is-hit\">0.3%</span>\n        <span class=\"sdw30__tcol4-6d7a sdw30__tval-verdict-3c8e\">低于预期</span>\n      </div>\n      <div class=\"sdw30__tablerow-8f9c\">\n        <span class=\"sdw30__tcol1-0a1d\">整体PCE同比</span>\n        <span class=\"sdw30__tcol2-2b3e sdw30__tval-expected-0f1c\">3.7%</span>\n        <span class=\"sdw30__tcol3-4c5f sdw30__tval-prev-2a3d\">3.7%</span>\n        <span class=\"sdw30__tcol5-8e9d sdw30__tval-actual-1a2f is-hit\">3.4%</span>\n        <span class=\"sdw30__tcol4-6d7a sdw30__tval-verdict-3c8e\">低于预期</span>\n      </div>\n      <div class=\"sdw30__tablerow-8f9c\">\n        <span class=\"sdw30__tcol1-0a1d\">个人支出月率</span>\n        <span class=\"sdw30__tcol2-2b3e sdw30__tval-expected-0f1c\">0.8%</span>\n        <span class=\"sdw30__tcol3-4c5f sdw30__tval-prev-2a3d\">0.1%</span>\n        <span class=\"sdw30__tcol5-8e9d sdw30__tval-actual-1a2f is-hit\">0.9%</span>\n        <span class=\"sdw30__tcol4-6d7a sdw30__tval-verdict-3c8e\">高于预期</span>\n      </div>\n      </div>\n\n    <div class=\"sdw30__tbnote-4b5e\">数据来源：道琼斯、路透调查共识预期，前值取上月公布的最新值（含官方修订）。本次8月新增就业同时由16.2万下修至13.3万。预期数据仅供参考，实际值以官方公布为准。</div>\n\n    <div class=\"sdw30__tbcaveat-5c6d\"><span class=\"sdw30__tbcaveatcap-7e8f\">口径说明：</span>本次8月PCE报告与美国国民账户年度修订同时发布，受口径调整影响，7月核心PCE环比由+0.2%下修至+0.1%；美国银行估算相关读数可能因此被压低约0.2个百分点。因此，同比读数回落不宜简单理解为当期物价降温。</div>\n  </article>\n\n  <!-- ===== 5. 数据解读 ===== -->\n  <article class=\"sdw30__card-2a6c\" style=\"padding:0.36rem;margin-bottom:0.24rem;\">\n    <div class=\"sdw30__section-2e3b\" style=\"margin-bottom:0.28rem;\">\n      <span class=\"sdw30__bar-4f5c\"></span>\n      <span class=\"sdw30__sectitle-6a7d\">数据解读</span>\n    </div>\n\n    <div class=\"sdw30__desc-2c3f\">\n      <div class=\"sdw30__reason-6c7f\">\n        <div class=\"sdw30__rhead-0e1b\">\n          <span class=\"sdw30__rnum-2f3c\">1</span>\n          <span class=\"sdw30__rstrong-6b7e\">非农远逊预期，加息押注降温</span>\n        </div>\n        <div class=\"sdw30__rbody-4a5d\">\n          9月非农新增就业仅2.9万人，远低于市场预期的8.4–9万；失业率升至4.2%，时薪月率0.1%同样低于预期，8月数据还下修2.9万。就业全面走弱，市场对美联储进一步收紧的预期降温，与政策利率挂钩的掉期合约已不再定价年内一次完整加息。\n          <div class=\"sdw30__dtgrid-8c9f\">\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">10月加息概率</div>\n              <div class=\"sdw30__dval-4f5c\">28.2%</div>\n              <div class=\"sdw30__dsub-6a7d\">维持不变 71.8%</div>\n            </div>\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">非农新增就业</div>\n              <div class=\"sdw30__dval-4f5c\">2.9万</div>\n              <div class=\"sdw30__dsub-6a7d\">远低于预期</div>\n            </div>\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">失业率</div>\n              <div class=\"sdw30__dval-4f5c\">4.2%</div>\n              <div class=\"sdw30__dsub-6a7d\">高于预期4.1%</div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"sdw30__reason-6c7f\">\n        <div class=\"sdw30__rhead-0e1b\">\n          <span class=\"sdw30__rnum-2f3c\">2</span>\n          <span class=\"sdw30__rstrong-6b7e\">美债收益率与美元同步回落</span>\n        </div>\n        <div class=\"sdw30__rbody-4a5d\">\n          非农公布后，10年期美债收益率单日下行约10个基点至5.15%，2年期同步回落至4.71%，美元指数走低至101.86。此前压制金价的高利率与强美元环境出现边际松动，持有黄金的机会成本随之下降。\n          <div class=\"sdw30__dtgrid-8c9f\">\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">10年美债收益率</div>\n              <div class=\"sdw30__dval-4f5c\" >5.15%</div>\n              <div class=\"sdw30__dsub-6a7d\">单日下行约10个基点</div>\n            </div>\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">2年美债收益率</div>\n              <div class=\"sdw30__dval-4f5c\">4.71%</div>\n              <div class=\"sdw30__dsub-6a7d\">单日下行7.7个基点</div>\n            </div>\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">美元指数</div>\n              <div class=\"sdw30__dval-4f5c\" >101.86</div>\n              <div class=\"sdw30__dsub-6a7d\">数据后小幅走低</div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"sdw30__reason-6c7f sdw30__reason-last-8d9a\">\n        <div class=\"sdw30__rhead-0e1b\">\n          <span class=\"sdw30__rnum-2f3c\">3</span>\n          <span class=\"sdw30__rstrong-6b7e\">油价这条反向链条同时牵动两端</span>\n        </div>\n        <div class=\"sdw30__rbody-4a5d\">\n          中东局势仍是油价的主导变量——美国增派第三艘航母打击群，但欧盟讨论释放原油与柴油储备，布伦特原油回落至100美元下方，WTI跌至90美元下方。油价若重新上行，将从通胀端强化加息预期、压制金价；若继续回落，则通胀压力缓解，对金价形成支撑。\n          <div class=\"sdw30__dtgrid-8c9f\">\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">布伦特原油</div>\n              <div class=\"sdw30__dval-4f5c\" >100美元下方</div>\n              <div class=\"sdw30__dsub-6a7d\">跌破关口</div>\n            </div>\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">WTI原油</div>\n              <div class=\"sdw30__dval-4f5c\" >90美元下方</div>\n              <div class=\"sdw30__dsub-6a7d\">日内回落</div>\n            </div>\n            <div class=\"sdw30__datatile-0d1a\">\n              <div class=\"sdw30__dlabel-2e3b\">假期变量</div>\n              <div class=\"sdw30__dval-4f5c\">美伊谈判</div>\n              <div class=\"sdw30__dsub-6a7d\">进展或反复</div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </article>\n\n  <!-- ===== 6. 情景落点 ===== -->\n  <article class=\"sdw30__card-2a6c\" style=\"padding:0.36rem;margin-bottom:0.24rem;\">\n    <div class=\"sdw30__section-2e3b\" style=\"margin-bottom:0.28rem;\">\n      <span class=\"sdw30__bar-4f5c\"></span>\n      <span class=\"sdw30__sectitle-6a7d\">假期情景落点</span>\n    </div>\n\n    <div class=\"sdw30__scenario-4e5b\" style=\"margin-bottom:0;\">\n      <div class=\"sdw30__shead-6f7c\" style=\"background:rgba(230,61,54,0.04);\">\n        <span class=\"sdw30__sflag-8a9d\" style=\"color:#E63D36;\">&#9679;</span>\n        <span class=\"sdw30__sname-0b1e\" style=\"color:#E63D36;\">通胀回落叠加就业降温</span>\n        <span class=\"sdw30__sprob-2c3f sdw30__sprob--high-4d5a\">已兑现</span>\n      </div>\n      <div class=\"sdw30__sbody-0a1d\">\n        <span class=\"sdw30__srange-2b3e\">PCE 低于预期，非农仅2.9万、远不及8万门槛，失业率升至4.2%</span><br>\n        通胀降温叠加劳动力市场走弱，美联储获得更多等待空间，美元与美债收益率同步回落。<strong style=\"color:#E63D36;\">对金价构成利好</strong>，国际金自低位延续修复。\n      </div>\n    </div>\n\n    <div style=\"margin-top:0.22rem;padding:0.16rem 0.20rem;background:#F7F8FA;border-radius:8px;font-size:0.20rem;color:#999;line-height:1.6;\">\n      注：以上为基于实际公布数据的复盘，非机构预测。\n    </div>\n  </article>\n\n  <!-- ===== 7. 央行增持 ===== -->\n  <article class=\"sdw30__card-2a6c\" style=\"padding:0.36rem;margin-bottom:0.24rem;\">\n    <div class=\"sdw30__section-2e3b\" style=\"margin-bottom:0.28rem;\">\n      <span class=\"sdw30__bar-4f5c\"></span>\n      <span class=\"sdw30__sectitle-6a7d\">央行增持</span>\n    </div>\n\n    <div class=\"sdw30__desc-2c3f\">\n      中国人民银行10月7日披露，9月末黄金储备报7747万盎司。这是央行自2024年10月以来连续第23个月增持；同期外汇储备环比减少380.74亿美元，储备结构在美元资产与黄金之间继续再平衡。\n      <div class=\"sdw30__dtgrid-8c9f\">\n        <div class=\"sdw30__datatile-0d1a\">\n          <div class=\"sdw30__dlabel-2e3b\">9月末黄金储备</div>\n          <div class=\"sdw30__dval-4f5c\">7747万盎司</div>\n          <div class=\"sdw30__dsub-6a7d\">约2409.59吨</div>\n        </div>\n        <div class=\"sdw30__datatile-0d1a\">\n          <div class=\"sdw30__dlabel-2e3b\">环比增持</div>\n          <div class=\"sdw30__dval-4f5c\">74万盎司</div>\n          <div class=\"sdw30__dsub-6a7d\">约23.02吨</div>\n        </div>\n        <div class=\"sdw30__datatile-0d1a\">\n          <div class=\"sdw30__dlabel-2e3b\">连续增持</div>\n          <div class=\"sdw30__dval-4f5c\">23个月</div>\n          <div class=\"sdw30__dsub-6a7d\">自2024年10月起</div>\n        </div>\n      </div>\n    </div>\n  </article>\n\n  <!-- ===== 8. 机构观点 ===== -->\n  <article class=\"sdw30__card-2a6c\" style=\"padding:0.36rem;margin-bottom:0.24rem;\">\n    <div class=\"sdw30__section-2e3b\" style=\"margin-bottom:0.28rem;\">\n      <span class=\"sdw30__bar-4f5c\"></span>\n      <span class=\"sdw30__sectitle-6a7d\">机构怎么看</span>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:0.20rem;\">\n\n      <div class=\"sdw30__viewcard-4c5f\">\n        <div class=\"sdw30__viewheader-6d7a\">\n          <span class=\"sdw30__viewname-8e9b\">瑞银 乔瓦尼·斯陶诺沃</span>\n          <span class=\"sdw30__viewtag-0f1c sdw30__viewtag--bearish-3c6f\">短期承压</span>\n        </div>\n        <div class=\"sdw30__viewrole-3b7d\">分析师</div>\n        <div class=\"sdw30__viewtext-6c7f\">在加息押注降温之前，高利率与强美元是金价承压的核心驱动。本次非农后利率端压制出现边际松动，但市场对12月加息仍有定价，实际收益率与美元的中期约束尚未解除，短期波动仍可能放大。</div>\n      </div>\n\n      <div class=\"sdw30__viewcard-4c5f\">\n        <div class=\"sdw30__viewheader-6d7a\">\n          <span class=\"sdw30__viewname-8e9b\">申银万国期货</span>\n          <span class=\"sdw30__viewtag-0f1c sdw30__viewtag--bullish-2a3d\">压制缓解</span>\n        </div>\n        <div class=\"sdw30__viewrole-3b7d\">研究团队</div>\n        <div class=\"sdw30__viewtext-6c7f\">国际油价回落，对贵金属的压制有所缓解。中长期看，美债信用风险重定价推动去美元化趋势延续，全球央行购金趋势不改，叠加地缘风险反复扰动，将为黄金价格构筑底部支撑，中长期价格中枢仍具备向上运行的基础。</div>\n      </div>\n\n      <div class=\"sdw30__viewcard-4c5f\">\n        <div class=\"sdw30__viewheader-6d7a\">\n          <span class=\"sdw30__viewname-8e9b\">混沌天成期货</span>\n          <span class=\"sdw30__viewtag-0f1c sdw30__viewtag--neutral-4b5e\">假期谨慎</span>\n        </div>\n        <div class=\"sdw30__viewrole-3b7d\">研究团队</div>\n        <div class=\"sdw30__viewtext-6c7f\">贵金属短期受高利率影响承压明显。本次非农与PCE均已落地，后续需关注美联储官员表态、通胀数据以及美债拍卖情况。地缘局势不确定性同时带来油价与通胀预期的变化，事件随机性较大，具有金融属性的品种容易出现高波动。</div>\n      </div>\n\n      <div class=\"sdw30__viewcard-4c5f\">\n        <div class=\"sdw30__viewheader-6d7a\">\n          <span class=\"sdw30__viewname-8e9b\">中财期货</span>\n          <span class=\"sdw30__viewtag-0f1c sdw30__viewtag--bullish-2a3d\">底部稳固</span>\n        </div>\n        <div class=\"sdw30__viewrole-3b7d\">研究团队</div>\n        <div class=\"sdw30__viewtext-6c7f\">贵金属市场仍受中东局势与原油价格、美元走势与美债利率、加息预期的影响，需关注通胀数据与加息预期变化。中长期看，若原油上涨动力不足带动能源通胀减弱，货币政策空间或重新打开，全球央行增持黄金与战略储备需求仍为金价提供底部支撑。</div>\n      </div>\n\n      <div class=\"sdw30__viewcard-4c5f\">\n        <div class=\"sdw30__viewheader-6d7a\">\n          <span class=\"sdw30__viewname-8e9b\">金瑞期货</span>\n          <span class=\"sdw30__viewtag-0f1c sdw30__viewtag--bearish-3c6f\">风险未散</span>\n        </div>\n        <div class=\"sdw30__viewrole-3b7d\">研究团队</div>\n        <div class=\"sdw30__viewtext-6c7f\">若中东局势继续恶化并推动油价重新上行，金银仍有向下测试前低的风险。地缘风险尚未消散，贵金属上行空间暂时受限，需警惕假期期间消息面带来的价格跳空。</div>\n      </div>\n\n    </div>\n  </article>\n\n  <!-- ===== 风险提示 ===== -->\n  <div class=\"sdw30__risk-6a7d\">\n    <div class=\"sdw30__risktext-8b9e\">\n      市场有风险，投资需谨慎。本页面仅供参考，不构成任何投资建议。<br>\n      以上情景分析基于市场预期数据推演，实际走势可能因多种因素而偏离。<br>\n      国庆假期国内金市休市，国际行情波动可能带来节后价格跳空，请留意持仓风险。\n    </div>\n  </div>\n\n</section>\n","contentForKycError":"暂无内容","kycConfig":{"enabled":false,"mode":"template","labels":[]}},"mark":"ai-
