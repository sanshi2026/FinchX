name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/finchx/__init__.py").read_text())
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          print(ast.literal_eval(node.value))
                          raise SystemExit
          raise SystemExit("src/finchx/__init__.py does not define __version__")
          PY
          )"
          release_version="${RELEASE_TAG#v}"

          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Validated release $RELEASE_TAG for package version $package_version"

  test:
    name: Test release source
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    permissions:
      contents: read
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -e ".[dev,calendar]"

      - name: Run tests
        run: pytest

  build:
    name: Build and validate artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install and smoke-test built artifacts
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke_dir="$(mktemp -d)"
            python -m venv "$smoke_dir"
            "$smoke_dir/bin/python" -m pip install "$artifact"
            "$smoke_dir/bin/python" - <<'PY'
          from importlib.metadata import version

          import finchx
          from finchx import FinchX
          from finchx.schemas import iter_schema_resources, read_schema

          assert version("finchx") == finchx.__version__

          schemas = list(iter_schema_resources())
          assert schemas, "no schema resources installed"
          quote_schema = read_schema("market-quote.schema.json")
          assert quote_schema["type"] == "object"

          FinchX()
          PY
            rm -rf "$smoke_dir"
          done

      - name: Validate package artifacts
        run: |
          set -euo pipefail
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          find dist -maxdepth 1 -type f -print

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finchx-${{ needs.validate.outputs.version }}-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: finchx-${{ needs.validate.outputs.version }}-dist
          path: dist

      - name: Verify artifact identity
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          expected = {
              f"finchx-{version}-py3-none-any.whl",
              f"finchx-{version}.tar.gz",
          }
          actual = {path.name for path in Path("dist").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected release artifacts: {sorted(actual)}")
          print("Validated exact wheel and sdist artifact set")
          PY

      - name: Publish exact artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
