name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,calendar]"
      - name: Run regression tests
        run: python -m pytest

  build:
    name: Build and smoke-test artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate artifacts
        run: |
          set -euo pipefail
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
      - name: Smoke-test isolated wheel and sdist installs
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke_dir="$(mktemp -d)"
            python -m venv "$smoke_dir"
            "$smoke_dir/bin/python" -m pip install "$artifact"
            "$smoke_dir/bin/python" - <<'PY'
          from importlib.metadata import version
          import finchx
          from finchx import FinchX
          from finchx.schemas import iter_schema_resources, read_schema

          assert version("finchx") == finchx.__version__
          assert list(iter_schema_resources()), "no schema resources installed"
          assert read_schema("market-quote.schema.json")["type"] == "object"
          FinchX()
          PY
            rm -rf "$smoke_dir"
          done
      - name: Save tested artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finchx-ci-${{ github.sha }}-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
